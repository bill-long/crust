# The desktop shell (Tauri) renders from its own origin and re-fetches this
# file at startup, so it can pick up operator config that the copy baked into
# its installer cannot carry (see `remoteConfigUrl` in public/config.json,
# issue #580). That read is cross-origin and needs CORS, or the shell silently
# falls back to its stale bundled config - the exact failure being fixed.
#
# Scoped via a map rather than an `add_header` inside `location = /config.json`
# because nginx REPLACES the inherited add_header set rather than merging it:
# one add_header there would drop all five security headers below for that
# response. nginx omits a header whose value is empty, so every other URI is
# untouched. The client sends a simple GET with no custom headers, so no
# preflight is involved and OPTIONS need not be answered.
#
# `*` is appropriate: config.json is already served unauthenticated to every
# visitor, carries no credentials, and is read with no cookies attached.
map $uri $crust_cors_origin {
    default        "";
    # An exact key, deliberately. A generalised regex looks like it would also
    # cover a reverse proxy that forwards the prefix (/crust/config.json), but
    # it cannot: no such file exists in the image, so `location /`'s try_files
    # internally redirects to /index.html, $uri becomes /index.html before the
    # header filter runs, and the response is HTML anyway - the client's
    # .json() would throw whether or not a CORS header came back. Supporting
    # that proxy shape needs a location that serves the prefixed path, not a
    # looser map key. Verified against the real image.
    "/config.json" "*";
}

server {
    # 8080, not 80: the runtime image is nginx-unprivileged (non-root), which
    # cannot bind ports below 1024. Keep in sync with EXPOSE/HEALTHCHECK in
    # the Dockerfile and the port mappings in deploy/docker-compose.yml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict Content Security Policy. This is a copy of the baseline CSP in
    # index.html (the single source of truth - the rationale for each source
    # is documented there); scripts/check-csp-sync.mjs fails the build if the
    # two drift apart. Kept as a header as well as the meta tag so responses
    # other than index.html are covered too.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: ipc: http://ipc.localhost https://ipc.localhost; frame-src https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header Access-Control-Allow-Origin $crust_cors_origin always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow camera/mic (needed for Element Call iframe); block geolocation
    add_header Permissions-Policy "camera=*, microphone=*, geolocation=()" always;

    # SPA: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    # Using expires (not add_header) to avoid overriding parent security headers
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
    }

    # Never cache the shell or runtime config
    location = /index.html {
        expires -1;
    }

    location = /config.json {
        expires -1;
    }

    # Never cache the service worker or its registration shim, so new
    # deploys are picked up promptly (exact-match locations take precedence
    # over the hashed-asset rule above).
    location = /sw.js {
        expires -1;
    }

    location = /registerSW.js {
        expires -1;
    }
}
