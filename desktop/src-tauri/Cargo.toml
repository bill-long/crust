[package]
name = "crust"
version = "0.1.4"
description = "Crust desktop shell"
authors = ["Bill Long <bill@selfish.net>"]
license = "Apache-2.0"
repository = "https://github.com/bill-long/crust"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# Required by tauri::generate_context! now that tauri.conf.json carries a
# "plugins" section: the generated context embeds that config as JSON values.
serde_json = "1"
rdev = "0.5"
# Only for the updater re-check timer; tauri already builds on tokio.
tokio = { version = "1", features = ["time"] }

