name: Desktop release

# Builds the Tauri desktop shell (Windows) and, on a `desktop-v*` tag, publishes
# the installers (.msi + NSIS .exe) to a draft GitHub Release. A manual
# `workflow_dispatch` run builds the same artifacts and uploads them as workflow
# artifacts (no release) so the pipeline can be exercised without cutting a tag.
#
# Least privilege: the `build` job runs all third-party install/build steps with
# a READ-ONLY token and uploads the installers as an artifact. The separate
# `release` job (tag pushes only) runs no untrusted code — it just downloads the
# artifact and creates the draft release with a write-scoped token. This keeps
# the write-capable token away from dependency/build scripts.
#
# Tag scheme: desktop releases use `desktop-v*` tags, kept separate from the
# `v*` tags the CI workflow (ci.yml) uses to publish the web container, so the
# two never cross-trigger.
#
# Code signing: the bundler signs the main binary and both installers through
# `bundle > windows > signCommand`, which runs desktop/src-tauri/scripts/
# sign-windows.mjs against the SSL.com eSigner cloud HSM. It needs four secrets
# (ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID,
# ESIGNER_TOTP_SECRET) held in the `windows-signing` environment, which gates
# them behind a required reviewer and a ref policy - see the build job. eSigner
# authenticates with the SSL.com account login itself, so those secrets are
# worth more than a scoped signing token would be; the credential also has an
# independent kill switch in SSL.com's Signing Credentials page.
#
# Without the secrets the build still runs and produces UNSIGNED installers; a
# `desktop-v*` tag is refused up front instead, and the signatures are verified
# before upload. The credentials are scoped to the build step alone, not the
# whole job.
#
# Auto-update (#261): the app checks `latest.json` on the newest published
# release, so publishing a draft is what makes an update live. That file is
# generated by the release job below rather than by tauri-action, whose own
# updater upload only fires when it creates the release itself - which this
# split design deliberately does not let it do. It points at the NSIS
# installer, matching what the ecosystem settled on (tauri-action's
# `updaterJsonPreferNsis`, whose `false` default its README calls legacy).
# TAURI_SIGNING_PRIVATE_KEY signs the update artifact; that is a separate
# keypair from Authenticode, and both are required for a release.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Default to read-only; the release job opts into contents: write explicitly.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # The eSigner credentials are environment secrets, not repo-wide ones: only
    # a job that declares this environment can read them, every run waits for a
    # required reviewer, and the environment's ref policy allows `main` and
    # `desktop-v*` tags only. The consequence is deliberate - this workflow no
    # longer builds from arbitrary branches, because a job blocked by the ref
    # policy fails rather than falling back to an unsigned build. Test desktop
    # build changes with a local `pnpm tauri build` (see desktop/README.md).
    environment: windows-signing
    # Read-only repo access; no write scopes — the write-capable token lives
    # only in the separate `release` job. `actions: read` is granted defensively
    # for the dependency caches: in practice the cache/artifact services use the
    # Actions runtime token (not GITHUB_TOKEN), but this matches GitHub's
    # documented default permissions and is harmless.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # Whether *every* eSigner secret is present, as a plain boolean for the
      # `if:` expressions below. Checking only one of them would let a release
      # tag past the guard below on a half-configured set, then fail deep into
      # the build - exactly what that guard exists to prevent.
      #
      # Blank means blank-after-trimming, the same test sign-windows.mjs
      # applies, so the workflow's conditionals and the script's own guard can
      # never disagree about whether signing is configured. That needs the
      # values themselves, which is why they are in this step's env - it is our
      # own inline script, and the point of scoping credentials to named steps
      # is to keep them out of the third-party actions in between, not out of
      # our own.
      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ES_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $required = [ordered]@{
            ESIGNER_USERNAME      = $env:ES_USERNAME
            ESIGNER_PASSWORD      = $env:ES_PASSWORD
            ESIGNER_CREDENTIAL_ID = $env:ES_CREDENTIAL_ID
            ESIGNER_TOTP_SECRET   = $env:ES_TOTP_SECRET
          }
          $blank = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })
          # All four or none. A partial set is a misconfiguration on any
          # trigger, not a request for an unsigned build, and catching it here
          # costs seconds instead of failing deep in the bundle step. This
          # mirrors sign-windows.mjs, which refuses the same way per artifact.
          if ($blank.Count -gt 0 -and $blank.Count -lt $required.Count) {
            Write-Host "::error::eSigner secrets are partially configured; blank: $($blank -join ', '). Set all four in the windows-signing environment, or none to build unsigned."
            exit 1
          }
          $configured = ($blank.Count -eq 0)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Signing configured: $configured"

          # The updater keypair is a separate system from Authenticode: it signs
          # the update artifact so an installed app can verify what it downloads.
          # Same all-or-none rule, tracked separately so an unsigned local-style
          # build can still exercise one without the other.
          $updaterKeys = [ordered]@{
            TAURI_SIGNING_PRIVATE_KEY          = $env:UPDATER_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:UPDATER_KEY_PASSWORD
          }
          $updaterBlank = @($updaterKeys.Keys | Where-Object { [string]::IsNullOrWhiteSpace($updaterKeys[$_]) })
          if ($updaterBlank.Count -gt 0 -and $updaterBlank.Count -lt $updaterKeys.Count) {
            Write-Host "::error::Updater signing keys are partially configured; blank: $($updaterBlank -join ', '). Set both in the windows-signing environment, or neither."
            exit 1
          }
          $updater = ($updaterBlank.Count -eq 0)
          "updater=$($updater.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Updater signing configured: $updater"

      # A release must never be published unsigned. Fail before the (long)
      # build rather than after it.
      - name: Require signing for a release build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && steps.signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          Write-Host "::error::A desktop-v* tag must produce signed installers, but the eSigner secrets are not configured on this repository. See desktop/README.md."
          exit 1

      # A release without a signed update artifact would publish a version that
      # installed apps cannot update to, and the `latest.json` step below would
      # have nothing to read.
      - name: Require updater signing for a release build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && steps.signing.outputs.updater != 'true'
        shell: pwsh
        run: |
          Write-Host "::error::A desktop-v* tag must produce a signed update artifact, but TAURI_SIGNING_PRIVATE_KEY is not configured. See desktop/README.md."
          exit 1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      # A desktop-vX.Y.Z tag must match the version in tauri.conf.json so the
      # git tag and the bundled installer names can never disagree. The tag is
      # passed via env (never spliced into the script body) to avoid injection.
      - name: Verify tag matches tauri.conf.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $confVersion = $conf.version
          $tagVersion = $env:TAG -replace '^desktop-v', ''
          if ($confVersion -ne $tagVersion) {
            Write-Error "Tag version '$tagVersion' does not match tauri.conf.json version '$confVersion'."
            exit 1
          }
          Write-Host "Version OK: $confVersion"

      # Build the web app first: the shell bundles dist/ via frontendDist
      # (../../dist). Default base path "/" (not the web container's /crust/).
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      # The Tauri project (desktop/) is a separate pnpm package; install its
      # @tauri-apps/cli so tauri-action can run `pnpm tauri build`.
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # jsign (a JVM tool) is what talks to the eSigner CSC API; only the file
      # hash leaves the runner. Skipped entirely on unsigned builds.
      - name: Set up JDK for jsign
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch jsign
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          JSIGN_VERSION: "7.5"
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Join-Path $env:RUNNER_TEMP "jsign-$env:JSIGN_VERSION.jar"
          $url = "https://repo1.maven.org/maven2/net/jsign/jsign/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar"
          Invoke-WebRequest -Uri $url -OutFile $jar
          # Pinned digest: this jar is handed the signing credentials, so a
          # swapped artifact upstream must fail the build, not sign with it.
          $actual = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:JSIGN_SHA256) {
            throw "jsign checksum mismatch: expected $env:JSIGN_SHA256, got $actual"
          }
          "JSIGN_JAR=$jar" >> $env:GITHUB_ENV

      # Build only (no tagName) — publishing is the separate, write-scoped job.
      # The eSigner credentials are scoped to this step: the bundler passes them
      # through to desktop/src-tauri/scripts/sign-windows.mjs for each artifact.
      # Always --verbose: the bundler pipes the sign command's output and echoes
      # it only when the command succeeds, so without it any signing failure -
      # including the deliberate one on a half-configured credential set, which
      # by definition happens when signing is *not* detected as configured -
      # surfaces as a bare "failed to run node".
      # createUpdaterArtifacts lives in a config patch applied only here, not in
      # tauri.conf.json: with it on, the bundler refuses to finish without
      # TAURI_SIGNING_PRIVATE_KEY, which would break `pnpm tauri build` for
      # every contributor - and this workflow's ref policy already means feature
      # branches can only be built locally. The pubkey and endpoint stay in the
      # base config, since the app needs them at runtime.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ steps.signing.outputs.updater == 'true' && '--verbose --config src-tauri/tauri.updater.conf.json' || '--verbose' }}
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          # Signs the updater artifact (.sig) that installed apps verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Stage both installers into one flat directory so the uploaded artifact
      # has a predictable, flat layout (independent of upload-artifact's
      # least-common-ancestor path handling) for the release job to consume.
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi dist-installers/
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*-setup.exe dist-installers/
          if ("${{ steps.signing.outputs.updater }}" -eq "true") {
            # The .sig is what installed apps verify an update against; without
            # it the release job has no signature to put in latest.json.
            $sigs = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig -File)
            if ($sigs.Count -eq 0) {
              throw "createUpdaterArtifacts was enabled but no -setup.exe.sig was produced."
            }
            $sigs | Copy-Item -Destination dist-installers/
          }

      # Prove the artifacts are actually signed before they can reach a release.
      # The bundler restores an unsigned copy of the main binary in
      # target/release once bundling is done, so the only way to check the exe
      # users will run is to pull it back out of the MSI payload.
      - name: Verify signatures
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Every match is verified rather than the first: adding a second WiX
          # language would otherwise quietly leave an installer unchecked.
          $msis = @(Get-ChildItem dist-installers/*.msi -File)
          $setups = @(Get-ChildItem dist-installers/*-setup.exe -File)
          if ($msis.Count -eq 0) { throw "no .msi found in dist-installers." }
          if ($setups.Count -eq 0) { throw "no -setup.exe found in dist-installers." }

          $files = [System.Collections.Generic.List[string]]::new()
          $msis + $setups | ForEach-Object { $files.Add($_.FullName) }

          for ($i = 0; $i -lt $msis.Count; $i++) {
            $msi = $msis[$i]
            $extract = Join-Path $env:RUNNER_TEMP "msi-payload-$i"
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            $msiexec = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extract`""
            )
            if ($msiexec.ExitCode -ne 0) {
              throw "msiexec administrative install of $($msi.Name) failed with exit code $($msiexec.ExitCode)."
            }
            $exes = @(Get-ChildItem $extract -Recurse -Filter 'crust.exe' -File)
            if ($exes.Count -eq 0) {
              throw "crust.exe was not found in the payload of $($msi.Name)."
            }
            $exes | ForEach-Object { $files.Add($_.FullName) }
          }

          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne 'Valid') {
              throw "$name is not validly signed (status: $($sig.Status) - $($sig.StatusMessage))"
            }
            # Without a timestamp every signature would expire with the
            # certificate, breaking installers that are already in the wild.
            if (-not $sig.TimeStamperCertificate) {
              throw "$name is signed but carries no timestamp."
            }
            Write-Host "$name -- signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crust-desktop-installers
          path: dist-installers
          if-no-files-found: error

  release:
    # Only tag pushes publish a release. This job runs no untrusted build code,
    # so it can safely hold the write-scoped token.
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: crust-desktop-installers
          path: installers

      # The updater manifest. tauri-action writes this itself only when it
      # creates the release, which this split design does not let it do, so it
      # is assembled here from the .sig the build produced. It points at the
      # NSIS installer: pointing at the MSI is tauri-action's legacy default and
      # would update an NSIS-installed app with an MSI, leaving two uninstall
      # entries (tauri-apps/tauri-action#1027).
      #
      # The installer URL is pinned to this tag, so a manifest always resolves
      # to the exact build it was generated from. The endpoint the app polls is
      # `releases/latest/download/latest.json`, which follows whichever release
      # is published - so publishing the draft is what makes an update live.
      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Exactly one of each, asserted rather than assumed: a second
          # architecture or language would otherwise make these globs expand to
          # several paths and silently produce a malformed manifest. (The
          # Windows-side staging and verify steps assert the same thing.)
          setups=(installers/*-setup.exe)
          sigs=(installers/*-setup.exe.sig)
          if [ ${#setups[@]} -ne 1 ] || [ ! -f "${setups[0]}" ]; then
            echo "::error::expected exactly one -setup.exe in installers/, found ${#setups[@]}"
            exit 1
          fi
          if [ ${#sigs[@]} -ne 1 ] || [ ! -f "${sigs[0]}" ]; then
            echo "::error::expected exactly one -setup.exe.sig in installers/, found ${#sigs[@]}"
            exit 1
          fi
          setup="${setups[0]}"
          sig_file="${sigs[0]}"
          version="${TAG#desktop-v}"
          cat > installers/latest.json <<JSON
          {
            "version": "$version",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "$sig_file")",
                "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$setup")"
              }
            }
          }
          JSON
          # Fail here rather than publishing a manifest no app can parse.
          python3 -c "import json,sys; d=json.load(open('installers/latest.json')); p=d['platforms']['windows-x86_64']; assert d['version'] and p['signature'] and p['url'].endswith('-setup.exe'), d"
          cat installers/latest.json

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(installers/*.msi installers/*-setup.exe installers/latest.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Crust Desktop $TAG" \
              --notes "Automated desktop build. The app and both installers are Authenticode-signed and timestamped; SmartScreen may still warn until the signature accrues reputation. Installed copies auto-update to this version once the release is published. Prefer the .exe installer: it is the one auto-updates are delivered through." \
              "${assets[@]}"
          fi
