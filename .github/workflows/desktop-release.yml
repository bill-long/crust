name: Desktop release

# Builds the Tauri desktop shell (Windows) and, on a `desktop-v*` tag, publishes
# the installers (.msi + NSIS .exe) to a draft GitHub Release. A manual
# `workflow_dispatch` run builds the same artifacts and uploads them as workflow
# artifacts (no release) so the pipeline can be exercised without cutting a tag.
#
# Least privilege: the `build` job runs all third-party install/build steps with
# a READ-ONLY token and uploads the installers as an artifact. The separate
# `release` job (tag pushes only) runs no untrusted code — it just downloads the
# artifact and creates the draft release with a write-scoped token. This keeps
# the write-capable token away from dependency/build scripts.
#
# Tag scheme: desktop releases use `desktop-v*` tags, kept separate from the
# `v*` tags the CI workflow (ci.yml) uses to publish the web container, so the
# two never cross-trigger.
#
# Code signing: the bundler signs the main binary and both installers through
# `bundle > windows > signCommand`, which runs desktop/src-tauri/scripts/
# sign-windows.mjs against the SSL.com eSigner cloud HSM. It needs four repo
# secrets (ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID,
# ESIGNER_TOTP_SECRET). Without them the build still runs and produces UNSIGNED
# installers, so PRs and forks keep working; a `desktop-v*` tag is refused
# up front instead, and the signatures are verified before upload. The
# credentials are scoped to the build step alone, not the whole job.
# Auto-update arrives in a later Phase 3 step (#261).

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Default to read-only; the release job opts into contents: write explicitly.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Read-only repo access; no write scopes — the write-capable token lives
    # only in the separate `release` job. `actions: read` is granted defensively
    # for the dependency caches: in practice the cache/artifact services use the
    # Actions runtime token (not GITHUB_TOKEN), but this matches GitHub's
    # documented default permissions and is harmless.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # Whether this repo has the eSigner secrets, as a plain boolean the `if:`
      # expressions below can read. Only the username is exposed here (and only
      # to this step) so the credential set stays scoped to the build step.
      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:ES_USERNAME)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Signing configured: $configured"

      # A release must never be published unsigned. Fail before the (long)
      # build rather than after it.
      - name: Require signing for a release build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && steps.signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          Write-Host "::error::A desktop-v* tag must produce signed installers, but the eSigner secrets are not configured on this repository. See desktop/README.md."
          exit 1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      # A desktop-vX.Y.Z tag must match the version in tauri.conf.json so the
      # git tag and the bundled installer names can never disagree. The tag is
      # passed via env (never spliced into the script body) to avoid injection.
      - name: Verify tag matches tauri.conf.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $confVersion = $conf.version
          $tagVersion = $env:TAG -replace '^desktop-v', ''
          if ($confVersion -ne $tagVersion) {
            Write-Error "Tag version '$tagVersion' does not match tauri.conf.json version '$confVersion'."
            exit 1
          }
          Write-Host "Version OK: $confVersion"

      # Build the web app first: the shell bundles dist/ via frontendDist
      # (../../dist). Default base path "/" (not the web container's /crust/).
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      # The Tauri project (desktop/) is a separate pnpm package; install its
      # @tauri-apps/cli so tauri-action can run `pnpm tauri build`.
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # jsign (a JVM tool) is what talks to the eSigner CSC API; only the file
      # hash leaves the runner. Skipped entirely on unsigned builds.
      - name: Set up JDK for jsign
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch jsign
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          JSIGN_VERSION: "7.5"
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Join-Path $env:RUNNER_TEMP "jsign-$env:JSIGN_VERSION.jar"
          $url = "https://repo1.maven.org/maven2/net/jsign/jsign/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar"
          Invoke-WebRequest -Uri $url -OutFile $jar
          # Pinned digest: this jar is handed the signing credentials, so a
          # swapped artifact upstream must fail the build, not sign with it.
          $actual = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:JSIGN_SHA256) {
            throw "jsign checksum mismatch: expected $env:JSIGN_SHA256, got $actual"
          }
          "JSIGN_JAR=$jar" >> $env:GITHUB_ENV

      # Build only (no tagName) — publishing is the separate, write-scoped job.
      # The eSigner credentials are scoped to this step: the bundler passes them
      # through to desktop/src-tauri/scripts/sign-windows.mjs for each artifact.
      # --verbose on signed builds: the bundler pipes the sign command's output
      # and echoes it only when the command succeeds, so without verbose a
      # signing failure surfaces as a bare "failed to run node".
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ steps.signing.outputs.configured == 'true' && '--verbose' || '' }}
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}

      # Stage both installers into one flat directory so the uploaded artifact
      # has a predictable, flat layout (independent of upload-artifact's
      # least-common-ancestor path handling) for the release job to consume.
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi dist-installers/
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*-setup.exe dist-installers/

      # Prove the artifacts are actually signed before they can reach a release.
      # The bundler restores an unsigned copy of the main binary in
      # target/release once bundling is done, so the only way to check the exe
      # users will run is to pull it back out of the MSI payload.
      - name: Verify signatures
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-Item dist-installers/*.msi
          $setup = Get-Item dist-installers/*-setup.exe

          $extract = Join-Path $env:RUNNER_TEMP 'msi-payload'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $msiexec = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extract`""
          )
          if ($msiexec.ExitCode -ne 0) {
            throw "msiexec administrative install failed with exit code $($msiexec.ExitCode)."
          }
          $exe = Get-ChildItem $extract -Recurse -Filter 'Crust.exe' | Select-Object -First 1
          if (-not $exe) { throw "Crust.exe was not found in the extracted MSI payload." }

          foreach ($file in @($msi.FullName, $setup.FullName, $exe.FullName)) {
            $name = Split-Path $file -Leaf
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne 'Valid') {
              throw "$name is not validly signed (status: $($sig.Status) - $($sig.StatusMessage))"
            }
            # Without a timestamp every signature would expire with the
            # certificate, breaking installers that are already in the wild.
            if (-not $sig.TimeStamperCertificate) {
              throw "$name is signed but carries no timestamp."
            }
            Write-Host "$name -- signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crust-desktop-installers
          path: dist-installers
          if-no-files-found: error

  release:
    # Only tag pushes publish a release. This job runs no untrusted build code,
    # so it can safely hold the write-scoped token.
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: crust-desktop-installers
          path: installers

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(installers/*.msi installers/*-setup.exe)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Crust Desktop $TAG" \
              --notes "Automated desktop build. The app and both installers are Authenticode-signed and timestamped; SmartScreen may still warn until the signature accrues reputation. Auto-update arrives in a later Phase 3 step." \
              "${assets[@]}"
          fi
